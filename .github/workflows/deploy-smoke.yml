name: deploy-smoke

# 把 backend/docker-compose.yaml 真正拉起来，通过前端 nginx 访问页面和接口。
on:
  pull_request:
    paths:
      - 'backend/Dockerfile'
      - 'backend/.dockerignore'
      - 'backend/docker-compose.yaml'
      - 'backend/docker-compose.libs.yaml'
      - 'backend/.env.example'
      - 'frontend/admin/react/scripts/deploy/**'
      - 'frontend/admin/react/.dockerignore'
      - '.github/workflows/deploy-smoke.yml'
  workflow_dispatch:

jobs:
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Write .env
        run: |
          # 每次随机生成，口令只用字母数字（会拼进 DSN / redis URI）；admin 口令要满足复杂度
          rnd() { openssl rand -hex 12; }
          cp .env.example .env
          sed -i \
            -e "s/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=$(rnd)/" \
            -e "s/^REDIS_PASSWORD=.*/REDIS_PASSWORD=$(rnd)/" \
            -e "s/^MINIO_ROOT_USER=.*/MINIO_ROOT_USER=gwa$(rnd)/" \
            -e "s/^MINIO_ROOT_PASSWORD=.*/MINIO_ROOT_PASSWORD=$(rnd)/" \
            -e "s/^GWA_ADMIN_INITIAL_PASSWORD=.*/GWA_ADMIN_INITIAL_PASSWORD=Ci@$(rnd)Aa1/" \
            -e '/^GWA_AUTH_JWT_PRIVATE_KEY=/d' \
            .env
          # 每次生成自己的 JWT 私钥，写法与 .env.example 里给客户的命令一致
          printf 'GWA_AUTH_JWT_PRIVATE_KEY="%s"\n' "$(openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048)" >> .env

      - name: Validate compose files
        run: |
          docker compose config -q
          docker compose -f docker-compose.libs.yaml config -q

      - name: Build images
        run: docker compose build

      - name: Start
        run: docker compose up -d --wait --wait-timeout 600

      - name: Backend /readyz
        run: docker compose exec -T admin-service wget -q -O - http://127.0.0.1:7788/readyz

      - name: Front page via nginx
        run: |
          curl -fsS http://127.0.0.1/ -o index.html
          grep -q 'id="root"' index.html
          # SPA 路由回退到 index.html
          curl -fsS http://127.0.0.1/auth/login | grep -q 'id="root"'

      - name: Public API via nginx (captcha)
        run: |
          # 必须是后端返回的 JSON，而不是 nginx 回退出来的 index.html
          curl -fsS -D captcha.headers http://127.0.0.1/admin/v1/captcha -o captcha.json
          cat captcha.headers
          grep -qi '^content-type: application/json' captcha.headers
          jq -e '(.captchaId | type == "string" and length > 0) and (.imageBase64 | type == "string" and length > 0)' captcha.json > /dev/null

      - name: SSE route reaches backend via nginx
        run: |
          # 不带令牌：SSE 服务（third_party/kratos-transport/transport/sse/http.go）鉴权失败返回 401 纯文本。
          # 拿到这个 401 才说明 /events 真的到了 7789，而不是落到 SPA 回退或别的路由。
          code=$(curl -s -D sse.headers -o sse.body -w '%{http_code}' --max-time 10 'http://127.0.0.1/events?stream=1')
          echo "SSE status: $code"; cat sse.headers sse.body; echo
          test "$code" = 401
          # set -e 不会因 "! cmd" 失败而退出，所以写成显式 if
          if grep -qi '^content-type: text/html' sse.headers || grep -qi '<html' sse.body; then
            echo "SSE returned HTML" >&2; exit 1
          fi

      - name: Container logs on failure
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail=200

      - name: Tear down
        if: always()
        run: docker compose down -v
