name: deploy-smoke

# 把 backend/docker-compose.yaml 真正拉起来，通过前端 nginx 访问页面和接口。
on:
  pull_request:
    paths:
      - 'backend/Dockerfile'
      - 'backend/.dockerignore'
      - 'backend/docker-compose.yaml'
      - 'backend/docker-compose.libs.yaml'
      - 'backend/.env.example'
      - 'frontend/admin/react/scripts/deploy/**'
      - 'frontend/admin/react/.dockerignore'
      - '.github/workflows/deploy-smoke.yml'
  workflow_dispatch:

jobs:
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Write .env
        run: |
          # 每次随机生成，口令只用字母数字（会拼进 DSN / redis URI）；admin 口令要满足复杂度
          rnd() { openssl rand -hex 12; }
          cp .env.example .env
          sed -i \
            -e "s/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=$(rnd)/" \
            -e "s/^REDIS_PASSWORD=.*/REDIS_PASSWORD=$(rnd)/" \
            -e "s/^MINIO_ROOT_USER=.*/MINIO_ROOT_USER=gwa$(rnd)/" \
            -e "s/^MINIO_ROOT_PASSWORD=.*/MINIO_ROOT_PASSWORD=$(rnd)/" \
            -e "s/^GWA_ADMIN_INITIAL_PASSWORD=.*/GWA_ADMIN_INITIAL_PASSWORD=Ci@$(rnd)Aa1/" \
            .env

      - name: Validate compose files
        run: |
          docker compose config -q
          docker compose -f docker-compose.libs.yaml config -q

      - name: Build images
        run: docker compose build

      - name: Start
        run: docker compose up -d --wait --wait-timeout 600

      - name: Backend /readyz
        run: docker compose exec -T admin-service wget -q -O - http://127.0.0.1:7788/readyz

      - name: Front page via nginx
        run: |
          curl -fsS http://127.0.0.1/ -o index.html
          grep -q 'id="root"' index.html
          # SPA 路由回退到 index.html
          curl -fsS http://127.0.0.1/auth/login | grep -q 'id="root"'

      - name: Public API via nginx (captcha)
        run: |
          curl -fsS http://127.0.0.1/admin/v1/captcha -o captcha.json
          head -c 120 captcha.json; echo

      - name: SSE route reaches backend via nginx
        run: |
          # 不带令牌：只验证反代通了（后端给出非 5xx 响应），不是 nginx 的 502/504
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 'http://127.0.0.1/events?stream=1' || true)
          echo "SSE status: $code"
          case "$code" in 000|5*) exit 1 ;; esac

      - name: Container logs on failure
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail=200

      - name: Tear down
        if: always()
        run: docker compose down -v
