name: frontend-mirror-parity

on:
  push:
    paths:
      - 'frontend/admin/react/src/core/transport/sse/**'
      - 'frontend/admin/react/src/core/transport/rest/pagination.ts'
      - 'frontend/admin/react/src/core/transport/rest/preset-interceptors.ts'
      - 'scripts/check-frontend-mirror.mjs'
  pull_request:
    paths:
      - 'frontend/admin/react/src/core/transport/sse/**'
      - 'frontend/admin/react/src/core/transport/rest/pagination.ts'
      - 'frontend/admin/react/src/core/transport/rest/preset-interceptors.ts'
      - 'scripts/check-frontend-mirror.mjs'

jobs:
  frontend-mirror-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/check-frontend-mirror.mjs
