# ${GWA_XXX:默认值}：设置了环境变量 GWA_XXX 就用它（Compose 部署由 .env 注入），否则用默认值。
# 密码请只用字母和数字，避免破坏 DSN / URI 格式。
data:
  database:
    driver: "postgres"
    source: "host=postgres port=5432 user=postgres password=${GWA_DB_PASSWORD:*Abcd123456} dbname=gwa sslmode=disable"
#    driver: "mysql"
#    source: "root:*Abcd123456@tcp(localhost:3306)/gwa?parseTime=true&charset=utf8mb4&loc=Asia%2FShanghai"
    migrate: true
    debug: false
    enable_trace: false
    enable_metrics: false
    max_idle_connections: 25
    max_open_connections: 25
    connection_max_lifetime: 300s

  redis:
    addr: "redis:6379"
    password: "${GWA_REDIS_PASSWORD:*Abcd123456}"
    dial_timeout: 10s
    read_timeout: 0.4s
    write_timeout: 0.6s

  # 外部数据源（客户已有的业务库，可读可写，默认只读）。键是数据源名，代码里按名字取；
  # 外部数据示例页用的名字固定为 demo。时长用秒写（1800s），不支持 30m 这种写法。
  # 说明见 docs/crud_module_guide/external.md。
