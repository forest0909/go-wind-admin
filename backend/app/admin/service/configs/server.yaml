server:
  rest:
    addr: ":7788"
    timeout: 10s
    enable_swagger: true
    # pprof 路由（/debug/*）不经过登录鉴权，默认关闭。
    # 需要排查性能时在 configs/local/server.yaml 里写 server.rest.enable_pprof: true，
    # 并且只在内网/本机可达的环境打开，用完关掉。
    enable_pprof: false
    # /metrics（Prometheus）不经过登录鉴权，默认关闭。同 pprof：只在内网可达的环境打开，见 docs/backend_deploy.md「监控」。
    enable_metrics: false
    # 可信反向代理：不写保持默认（私网 + 回环）。只对反向代理开放端口时建议收窄，见 docs/backend_deploy.md。
    # trusted_proxies:
    #   cidrs:
    #     - "172.18.0.2"
    cors:
      # 前端 refresh token 走 HttpOnly Cookie（withCredentials=true），
      # 预检响应必须带 Access-Control-Allow-Credentials: true
      allow_credentials: true
      headers:
        - "X-Requested-With"
        - "X-Request-ID"
        - "Content-Type"
        - "Authorization"
        - "X-Captcha-Id"
        - "X-Captcha-Value"
      methods:
        - "GET"
        - "POST"
        - "PUT"
        - "DELETE"
        - "HEAD"
        - "OPTIONS"
      origins:
        # 本仓库只保留 React。15889 是 Vite 端口被占用时的顺延位。
        - "http://localhost:15888"
        - "http://localhost:15889"
    middleware:
      enable_logging: true
      enable_recovery: true
      enable_tracing: true
      enable_validate: true
      enable_circuit_breaker: true
      enable_metadata: true

  asynq:
    uri: "redis://:${GWA_REDIS_PASSWORD:*Abcd123456}@redis:6379/1"
    codec: "json"
    concurrency: 10
    shutdown_timeout: 10s
    enable_gracefully_shutdown: false
    enable_strict_priority: true
    location: "Asia/Shanghai"
    queues:
      critical: 10
      default: 5
      low: 1

  sse:
    addr: ":7789"
    codec: "json"
    path: "/events"
    auto_stream: true
    auto_reply: false
