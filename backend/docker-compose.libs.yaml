# 依赖模式：只起 PostgreSQL / Redis / MinIO，后端在本机跑。
# 端口只绑 127.0.0.1；口令从同目录 .env 读取（cp .env.example .env 后修改），缺了直接报错。
# 本机后端用 configs/local/ 覆盖主机名和口令，或者导出同名的 GWA_* 环境变量。
networks:
  app-tier:
    driver: bridge

services:
  postgres:
    image: docker.io/library/postgres:17.6-alpine
    restart: always
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - app-tier
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?请在 .env 中设置 POSTGRES_PASSWORD（参考 .env.example）}
      - POSTGRES_DB=gwa
      - TZ=Asia/Shanghai
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gwa"]
      interval: 5s
      timeout: 5s
      retries: 20

  #  mysql:
