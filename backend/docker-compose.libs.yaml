# 依赖模式：只起 PostgreSQL / Redis / MinIO，后端在本机跑。
# 端口只绑 127.0.0.1；口令从同目录 .env 读取（cp .env.example .env 后修改），缺了直接报错。
# 本机后端用 configs/local/ 覆盖主机名和口令，或者导出同名的 GWA_* 环境变量。
networks:
  app-tier:
    driver: bridge

services:
  postgres:
    image: docker.io/bitnami/postgresql:latest
    restart: always
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - app-tier
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?请在 .env 中设置 POSTGRES_PASSWORD（参考 .env.example）}
      - POSTGRES_DB=gwa
    volumes:
      - postgres-data:/bitnami/postgresql
    ulimits:
      nofile:
        soft: 65535
        hard: 65535

  #  mysql:
  #    image: docker.io/mariadb:latest
  #    container_name: mysql
  #    hostname: mysql
  #    restart: always
  #    ports:
  #      - "3306:3306"
  #    networks:
  #      - app-tier
  #    environment:
  #      - MARIADB_ROOT_PASSWORD=*Abcd123456
  #      - MARIADB_USER=admin
  #      - MARIADB_PASSWORD=*Abcd123456
  #      - MARIADB_DATABASE=gwc
  #      - ALLOW_EMPTY_PASSWORD=yes
  #      - TZ=Asia/Shanghai
  #    command:
  #      --max_connections=5000
  #      --max_allowed_packet=64M
  #      --wait_timeout=600
  #      --interactive_timeout=600
  #      --net_read_timeout=120
  #      --net_write_timeout=120
  #      --skip-name-resolve
  #      --back_log=2048
  #    ulimits:
  #      nofile:
  #        soft: 65535
  #        hard: 65535

  redis:
    image: docker.io/bitnami/redis:latest
    restart: always
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - app-tier
    environment:
      - ALLOW_EMPTY_PASSWORD=no
      - REDIS_PASSWORD=${REDIS_PASSWORD:?请在 .env 中设置 REDIS_PASSWORD（参考 .env.example）}
      # 任务队列（asynq）也在这个 Redis 里，开 AOF 才能在重启后保住未执行的任务
      - REDIS_AOF_ENABLED=yes
      - REDIS_IO_THREADS_DO_READS=yes
      - REDIS_DISABLE_COMMANDS=FLUSHDB,FLUSHALL,CONFIG
    volumes:
      - redis-data:/bitnami/redis/data

  minio:
    image: docker.io/minio/minio:latest
    restart: always
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    networks:
      - app-tier
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:?请在 .env 中设置 MINIO_ROOT_USER（参考 .env.example）}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:?请在 .env 中设置 MINIO_ROOT_PASSWORD（参考 .env.example）}
      - MINIO_DEFAULT_BUCKETS=images
      - MINIO_FORCE_NEW_KEYS=yes
      - BITNAMI_DEBUG=true
    volumes:
      - minio-data:/data
    command: server /data --console-address ':9001'

# 具名卷：docker compose down / up 之后数据还在（down -v 才会删）
volumes:
  postgres-data:
  redis-data:
  minio-data:
