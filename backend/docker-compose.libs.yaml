  #      --skip-name-resolve
  #      --back_log=2048
  #    ulimits:
  #      nofile:
  #        soft: 65535
  #        hard: 65535

  redis:
    image: docker.io/library/redis:7.4.5-alpine
    restart: always
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - app-tier
    environment:
      # 只给下面的健康检查用
      - REDIS_PASSWORD=${REDIS_PASSWORD:?请在 .env 中设置 REDIS_PASSWORD（参考 .env.example）}
    # 任务队列（asynq）也在这个 Redis 里，开 AOF 才能在重启后保住未执行的任务
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: docker.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: always
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    networks:
      - app-tier
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:?请在 .env 中设置 MINIO_ROOT_USER（参考 .env.example）}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:?请在 .env 中设置 MINIO_ROOT_PASSWORD（参考 .env.example）}
    volumes:
      - minio-data:/data
    command: server /data --console-address ':9001'
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

# 具名卷：docker compose down / up 之后数据还在（down -v 才会删）
volumes:
  postgres-data:
  redis-data:
  minio-data:
