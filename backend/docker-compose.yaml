# 完整模式：一个客户一套环境。PostgreSQL / Redis / MinIO / 后端 / 前端 nginx 都在 Docker 里。
# 只对外暴露前端 nginx（默认宿主机 80 端口）：它托管页面，并把 /admin/ 和 /events 反代给后端，同源访问。
# 后端和依赖服务不映射端口，只在 app-tier 网络内可达。
# 口令从同目录 .env 读取（cp .env.example .env 后修改），缺了 docker compose 直接报错。
# 说明见 docs/backend_deploy.md「Docker Compose 部署」。
networks:
  app-tier:
    driver: bridge

services:
  postgres:
    image: docker.io/library/postgres:17.6-alpine
    restart: always
    networks:
      - app-tier
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?请在 .env 中设置 POSTGRES_PASSWORD（参考 .env.example）}
      - POSTGRES_DB=gwa
      - TZ=Asia/Shanghai
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gwa"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: docker.io/library/redis:7.4.5-alpine
    restart: always
    networks:
      - app-tier
    environment:
      # 只给下面的健康检查用
      - REDIS_PASSWORD=${REDIS_PASSWORD:?请在 .env 中设置 REDIS_PASSWORD（参考 .env.example）}
    # 任务队列（asynq）也在这个 Redis 里，开 AOF 才能在重启后保住未执行的任务
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 20

  # 文件管理、头像、富文本图片的存储。桶由后端在第一次上传时自动创建。
  minio:
    # MinIO 官方已停止发布社区版镜像（docker.io/minio/minio 已删除，quay.io 不再允许匿名拉取）。
    # pgsty/minio 是持续维护的社区 fork，命令、端口、/data 目录、S3 接口与原版一致，镜像内带 curl 和 mc。
    image: docker.io/pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    restart: always
    networks:
      - app-tier
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:?请在 .env 中设置 MINIO_ROOT_USER（参考 .env.example）}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:?请在 .env 中设置 MINIO_ROOT_PASSWORD（参考 .env.example）}
    volumes:
      - minio-data:/data
    command: server /data --console-address ':9001'
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20

  admin-service:
    image: go-wind-admin/admin-service
    restart: always
    pull_policy: never
    networks:
      - app-tier
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      - TZ=Asia/Shanghai
      # configs/*.yaml 里的 ${GWA_XXX:默认值} 占位符读这些变量，和上面各服务用同一份口令
      - GWA_DB_PASSWORD=${POSTGRES_PASSWORD:?请在 .env 中设置 POSTGRES_PASSWORD}
      - GWA_REDIS_PASSWORD=${REDIS_PASSWORD:?请在 .env 中设置 REDIS_PASSWORD}
      - GWA_MINIO_ACCESS_KEY=${MINIO_ROOT_USER:?请在 .env 中设置 MINIO_ROOT_USER}
      - GWA_MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:?请在 .env 中设置 MINIO_ROOT_PASSWORD}
      # 首次启动播种 admin 时使用的密码，完整部署必须提供
      - GWA_ADMIN_INITIAL_PASSWORD=${GWA_ADMIN_INITIAL_PASSWORD:?请在 .env 中设置 GWA_ADMIN_INITIAL_PASSWORD}
      # JWT 私钥，每个部署单独生成（只给私钥时公钥自动派生）。填仓库示例私钥会拒绝启动
      - GWA_AUTH_JWT_PRIVATE_KEY=${GWA_AUTH_JWT_PRIVATE_KEY:?请在 .env 中设置 GWA_AUTH_JWT_PRIVATE_KEY（生成方法见 .env.example）}
      # 可选：签名图片 URL 的密钥
      - GOWIND_CRYPTO_KEY=${GOWIND_CRYPTO_KEY:-}
      # 可选：外部数据源连接串，每个源一行，和 configs/data.yaml 的 ${GWA_EXT_<NAME>_DSN} 对应
      # - GWA_EXT_DEMO_DSN=${GWA_EXT_DEMO_DSN:-}
      - AUDIT_ARCHIVE_DIR=/app/data/audit-archive
      # 文件存储，默认 MinIO。改存本地磁盘：把下面两行取消注释（文件落在 admin-data 卷的 storage/ 目录），
      # 再删掉本服务 depends_on 里的 minio，不需要 MinIO 时也可以删掉上面的 minio 服务和 minio-data 卷。
      # 中途切换存储的后果见 docs/backend_deploy.md「文件存储」。
      # - GWA_OSS_STORAGE=local
      # - GWA_OSS_LOCAL_ROOT_DIR=/app/data/storage
    volumes:
      # 审计归档文件；本地存储模式下的上传文件也在这里（/app/data/storage）
      - admin-data:/app/data
    # /readyz 会 Ping 数据库和 Redis。首次启动要建表、播种、同步接口和权限，给足 start_period。
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:7788/readyz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 180s
    build:
      context: ./  # 指定 Dockerfile 所在的上下文路径
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: admin
        APP_VERSION: 1.0.0

  # React 页面 + 反向代理（见 frontend/admin/react/scripts/deploy/nginx.conf）
  frontend:
    image: go-wind-admin/frontend
    restart: always
    pull_policy: never
    networks:
      - app-tier
    depends_on:
      admin-service:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
    build:
      context: ../frontend/admin/react
      dockerfile: scripts/deploy/Dockerfile

# 具名卷：docker compose down / up 之后数据还在（down -v 才会删）
volumes:
  postgres-data:
  redis-data:
  minio-data:
  admin-data:
