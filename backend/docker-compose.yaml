# 完整模式：PostgreSQL / Redis / MinIO / admin-service 都在 Docker 里。
# 只对外暴露后端 7788（HTTP）和 7789（SSE）；依赖服务不映射端口，只在 app-tier 网络内可达。
# 口令从同目录 .env 读取（cp .env.example .env 后修改），缺了 docker compose 直接报错。
networks:
  app-tier:
    driver: bridge

services:
  postgres:
    image: docker.io/bitnami/postgresql:latest
    restart: always
    networks:
      - app-tier
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?请在 .env 中设置 POSTGRES_PASSWORD（参考 .env.example）}
      - POSTGRES_DB=gwa
    volumes:
      - postgres-data:/bitnami/postgresql
    ulimits:
      nofile:
        soft: 65535
        hard: 65535

  #  mysql:
  #    image: docker.io/mariadb:latest
  #    container_name: mysql
  #    hostname: mysql
  #    restart: always
  #    ports:
  #      - "3306:3306"
  #    networks:
  #      - app-tier
  #    environment:
  #      - MARIADB_ROOT_PASSWORD=*Abcd123456
  #      - MARIADB_USER=admin
  #      - MARIADB_PASSWORD=*Abcd123456
  #      - MARIADB_DATABASE=gwc
  #      - ALLOW_EMPTY_PASSWORD=yes
  #      - TZ=Asia/Shanghai
  #    command:
  #      --max_connections=5000
  #      --max_allowed_packet=64M
  #      --wait_timeout=600
  #      --interactive_timeout=600
  #      --net_read_timeout=120
  #      --net_write_timeout=120
  #      --skip-name-resolve
  #      --back_log=2048
  #    ulimits:
  #      nofile:
  #        soft: 65535
  #        hard: 65535

  redis:
    image: docker.io/bitnami/redis:latest
    restart: always
    networks:
      - app-tier
    environment:
      - ALLOW_EMPTY_PASSWORD=no
      - REDIS_PASSWORD=${REDIS_PASSWORD:?请在 .env 中设置 REDIS_PASSWORD（参考 .env.example）}
      # 任务队列（asynq）也在这个 Redis 里，开 AOF 才能在重启后保住未执行的任务
      - REDIS_AOF_ENABLED=yes
      - REDIS_IO_THREADS_DO_READS=yes
      - REDIS_DISABLE_COMMANDS=FLUSHDB,FLUSHALL,CONFIG
    volumes:
      - redis-data:/bitnami/redis/data

  minio:
    image: docker.io/minio/minio:latest
    restart: always
    networks:
      - app-tier
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:?请在 .env 中设置 MINIO_ROOT_USER（参考 .env.example）}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:?请在 .env 中设置 MINIO_ROOT_PASSWORD（参考 .env.example）}
      - MINIO_DEFAULT_BUCKETS=images
      - MINIO_FORCE_NEW_KEYS=yes
      - BITNAMI_DEBUG=true
    volumes:
      - minio-data:/data
    command: server /data --console-address ':9001'

#  jaeger:
#    image: docker.io/jaegertracing/all-in-one:latest
#    restart: always
#    ports:
#      - "6831:6831/udp"
#      - "5778:5778"
#      - "4317:4317"
#      - "4318:4318"
#      - "16686:16686"
#      - "14250:14250"
#      - "14268:14268"
#      - "14269:14269"
#    networks:
#      - app-tier
#    environment:
#      - COLLECTOR_ZIPKIN_HOST_PORT=:9411
#      - COLLECTOR_OTLP_ENABLED=true

  admin-service:
    image: go-wind-admin/admin-service
    restart: always
    pull_policy: never
    networks:
      - app-tier
    ports:
      - "7788:7788"
      - "7789:7789"
    depends_on:
      - postgres
      - redis
      - minio
    environment:
      - TZ=Asia/Shanghai
      # configs/*.yaml 里的 ${GWA_XXX:默认值} 占位符读这些变量，和上面各服务用同一份口令
      - GWA_DB_PASSWORD=${POSTGRES_PASSWORD:?请在 .env 中设置 POSTGRES_PASSWORD}
      - GWA_REDIS_PASSWORD=${REDIS_PASSWORD:?请在 .env 中设置 REDIS_PASSWORD}
      - GWA_MINIO_ACCESS_KEY=${MINIO_ROOT_USER:?请在 .env 中设置 MINIO_ROOT_USER}
      - GWA_MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:?请在 .env 中设置 MINIO_ROOT_PASSWORD}
      # 首次启动播种 admin 时使用的密码，完整部署必须提供
      - GWA_ADMIN_INITIAL_PASSWORD=${GWA_ADMIN_INITIAL_PASSWORD:?请在 .env 中设置 GWA_ADMIN_INITIAL_PASSWORD}
      # 可选：生产 JWT 私钥（只给私钥时公钥自动派生）、签名图片 URL 的密钥
      - GWA_AUTH_JWT_PRIVATE_KEY=${GWA_AUTH_JWT_PRIVATE_KEY:-}
      - GOWIND_CRYPTO_KEY=${GOWIND_CRYPTO_KEY:-}
      # 可选：外部数据源连接串，每个源一行，和 configs/data.yaml 的 ${GWA_EXT_<NAME>_DSN} 对应
      # - GWA_EXT_DEMO_DSN=${GWA_EXT_DEMO_DSN:-}
      - AUDIT_ARCHIVE_DIR=/app/data/audit-archive
    volumes:
      # 审计归档文件
      - admin-data:/app/data
    build:
      context: ./  # 指定 Dockerfile 所在的上下文路径
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: admin
        APP_VERSION: 1.0.0

# 具名卷：docker compose down / up 之后数据还在（down -v 才会删）
volumes:
  postgres-data:
  redis-data:
  minio-data:
  admin-data:
