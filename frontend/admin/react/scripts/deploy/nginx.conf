# 前端镜像的 nginx 配置（backend/docker-compose.yaml 的 frontend 服务）。
# 托管 React 构建产物，并把 API（/admin/）和 SSE（/events）反代到 admin-service，浏览器只访问这一个源，不需要 CORS。
# HTTPS 在本层之外终止（外层反代或负载均衡），见 docs/backend_deploy.md「HTTPS」。

worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include mime.types;
  default_type application/octet-stream;
  sendfile on;
  server_tokens off;

  # 外层反代已经带了 X-Forwarded-Proto 就原样转给后端，否则用本层的协议。
  # 后端据此决定 refresh token cookie 是否加 Secure。
  map $http_x_forwarded_proto $gwa_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
  }

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker 内置 DNS。proxy_pass 用变量，nginx 按 valid 周期重新解析：
    # admin-service 容器重建换了 IP 之后不会一直 502，后端没起来时 nginx 也能先启动。
    resolver 127.0.0.11 valid=10s ipv6=off;

    # 文件上传接口的请求体上限约 70.7 MiB（docs/backend_deploy.md「上传限制与超时」），这里不能更小。
    client_max_body_size 80m;

    gzip on;
    gzip_min_length 1k;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # 安全响应头。location 里不再写 add_header（写了会整组覆盖这里），缓存头改用 expires。
    # script-src 不在此声明：构建期往 index.html 注入了带内联脚本哈希的 meta CSP（build/plugins/csp.ts），
    # 多个 CSP 取交集，这里再写一份不带哈希的 script-src 会把内联主题脚本拦掉。
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header Content-Security-Policy "base-uri 'self'; object-src 'none'; frame-ancestors 'none'" always;

    # REST API。后端路由自带 /admin/v1 前缀，原样转发。
    location /admin/ {
      set $gwa_rest http://admin-service:7788;
      proxy_pass $gwa_rest;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      # 后端从右往左跳过可信代理（默认私网和回环）取客户端 IP，本层追加对端地址即可
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $gwa_forwarded_proto;
      # 大文件上传直接流给后端，不先落 nginx 临时文件；审计导出、大文件下载给足时间
      proxy_request_buffering off;
      proxy_read_timeout 300s;
      proxy_send_timeout 300s;
    }

    # SSE。必须关掉缓冲和压缩，否则事件攒在 nginx 里推不出去。
    location = /events {
      set $gwa_sse http://admin-service:7789;
      proxy_pass $gwa_sse;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $gwa_forwarded_proto;
      proxy_buffering off;
      proxy_cache off;
      proxy_request_buffering off;
      gzip off;
      proxy_read_timeout 86400s;
      proxy_send_timeout 86400s;
    }

    # 带内容哈希的构建产物，长期缓存
    location /assets/ {
      expires 1y;
      try_files $uri =404;
    }

    # SPA：找不到的路径都回退到 index.html，由前端路由处理。index.html 不缓存，发版后立即生效。
    location / {
      expires -1;
      try_files $uri $uri/ /index.html;
    }
  }
}
